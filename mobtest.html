<!DOCTYPE html><html><head><meta name="viewport" content="width=device-width,initial-scale=1">
<style>body{margin:0;background:#3a3a38;display:flex;gap:16px;padding:10px;font-family:sans-serif;color:#fff;font-size:12px}iframe{border:0;background:#fff;border-radius:8px}</style>
</head><body>
<div><div>PHONE 390x700</div><iframe id="p" src="index.html" style="width:390px;height:700px"></iframe></div>
<div><div>TABLET 760x700</div><iframe id="t" src="index.html" style="width:760px;height:700px"></iframe></div>
<script>
if(location.search.indexOf('chat')>-1){ setTimeout(function(){
  ['p','t'].forEach(function(id){ try{ var w=document.getElementById(id).contentWindow; w.document.getElementById('fab').click(); }catch(e){ document.title=e.message; } });
}, 4000); }
if(location.search.indexOf('hero')>-1){ setTimeout(function(){
  ['p','t'].forEach(function(id){ try{ var w=document.getElementById(id).contentWindow; w.scrollTo(0,0); }catch(e){} });
}, 2500); }
</script></body></html>
